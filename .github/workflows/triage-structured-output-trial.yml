name: Triage structured-output trial

# Manual trial of the triage-verdict action (.github/actions/triage-verdict) with the
# crcr-test-failure-triage skill and its verdict schema.
#
# It fails on purpose, hands the failure to the action, and checks that a verdict came
# back through the structured output tool (--json-schema). The job is green only if a
# verdict came back, so green/red here is the trial result. Nothing is sent to the CRCR
# relay.
#
# Configure ONE of:
#   - variable TRIAGE_AWS_ROLE_ARN: an AWS role that trusts this repo's GitHub OIDC
#     identity and grants Bedrock access (region: variable TRIAGE_AWS_REGION, default
#     us-east-1), or
#   - secret CLAUDE_CODE_OAUTH_TOKEN: a Claude Pro/Max login, made locally with
#     `claude setup-token` (uses the plan's usage limits, not API credits), or
#   - secret ANTHROPIC_API_KEY: an Anthropic API key from an active Console org.
# If more than one is set, Bedrock wins, then the OAuth token, then the API key.
#
# The model is Claude Haiku 5.5. Set the variable TRIAGE_MODEL to try another one.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # this run's job list, for the skill's input
  id-token: write # Bedrock path only

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check the model credentials are configured
        env:
          HAS_ROLE: ${{ vars.TRIAGE_AWS_ROLE_ARN != '' }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [[ "${HAS_ROLE}" != "true" && "${HAS_API_KEY}" != "true" && "${HAS_OAUTH}" != "true" ]]; then
            echo "::error::Set the variable TRIAGE_AWS_ROLE_ARN (Bedrock), or the secret CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY."
            exit 1
          fi

      # continue-on-error so the job's own result reflects the trial, not this failure.
      - name: Simulate a failure
        id: sim
        continue-on-error: true
        run: |
          set -o pipefail
          { echo "::error::simulated failure (structured-output trial)"; exit 1; } 2>&1 \
            | tee "${RUNNER_TEMP}/work.log"

      - name: Triage the failure
        id: triage
        if: steps.sim.outcome == 'failure'
        uses: ./.github/actions/triage-verdict
        with:
          log-file: ${{ runner.temp }}/work.log
          aws-role-arn: ${{ vars.TRIAGE_AWS_ROLE_ARN }}
          aws-region: ${{ vars.TRIAGE_AWS_REGION || 'us-east-1' }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ vars.TRIAGE_MODEL }}

      # The trial result: red unless a verdict came back.
      - name: Check a verdict came back
        if: always()
        env:
          VERDICT: ${{ steps.triage.outputs.verdict }}
          SIM: ${{ steps.sim.outcome }}
        run: |
          if [[ "${SIM}" != "failure" ]]; then
            echo "::error::The simulated failure did not fail (outcome: ${SIM:-skipped}), so nothing was tested."
            exit 1
          fi
          if [[ -z "${VERDICT}" ]]; then
            echo "::error::No verdict came back. See the warning from the 'Triage the failure' step."
            exit 1
          fi
          echo "OK: the action returned a verdict through the structured output tool."
          echo "${VERDICT}" | jq -r '"  \(.category) (\(.confidence)), analyzer model: \(.analyzer.model)"'
